<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nokielen RPG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;}
canvas{display:block;touch-action:none;}
#ui{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:10;}
#hud{display:flex;justify-content:space-between;align-items:flex-start;padding:10px;gap:8px;}
.hud-left,.hud-right{display:flex;flex-direction:column;gap:5px;min-width:120px;}
.bar-wrap{background:rgba(0,0,0,0.7);border:1px solid #333;border-radius:4px;padding:4px 7px;font-size:11px;}
.bar-label{color:#aaa;font-size:10px;margin-bottom:2px;}
.bar{height:7px;border-radius:3px;transition:width 0.2s;}
.hp-bar{background:linear-gradient(90deg,#c00,#e33);}
.mp-bar{background:linear-gradient(90deg,#006,#33e);}
.xp-bar{background:linear-gradient(90deg,#550,#aa0);}
#coins{background:rgba(0,0,0,0.7);border:1px solid #555;border-radius:4px;padding:4px 9px;font-size:12px;color:#fd0;align-self:flex-start;}
#quest-box{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);border:1px solid #444;border-radius:6px;padding:6px 14px;font-size:11px;color:#ccc;text-align:center;pointer-events:none;max-width:240px;}
#quest-box span{color:#f90;}
#msg{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border:1px solid #555;border-radius:6px;padding:6px 14px;font-size:13px;color:#fff;pointer-events:none;opacity:0;transition:opacity 0.4s;white-space:nowrap;}
#controls{position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:10px;pointer-events:all;z-index:20;}
#joystick-area{width:110px;height:110px;position:relative;}
#joystick-base{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);position:absolute;bottom:0;left:0;}
#joystick-knob{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.35);border:2px solid rgba(255,255,255,0.6);position:absolute;bottom:27px;left:27px;transition:none;}
#action-btns{display:flex;flex-direction:column;gap:7px;align-items:flex-end;}
.abtn{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.6);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:all;-webkit-tap-highlight-color:transparent;}
.abtn:active{transform:scale(0.9);}
#btn-row{display:flex;gap:7px;}
#minimap{position:fixed;top:10px;right:10px;width:70px;height:70px;border:1px solid #444;border-radius:4px;background:rgba(0,0,0,0.7);pointer-events:none;}
#level-badge{position:fixed;top:80px;left:10px;background:rgba(0,0,0,0.7);border:1px solid #666;border-radius:4px;padding:3px 8px;font-size:11px;color:#fc0;pointer-events:none;}
#screen-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
#screen-overlay h1{font-size:28px;color:#a855f7;letter-spacing:4px;margin-bottom:8px;}
#screen-overlay p{color:#888;font-size:13px;margin-bottom:18px;text-align:center;max-width:280px;}
#screen-overlay button{background:#4c1d95;border:1px solid #7c3aed;color:#fff;padding:10px 32px;border-radius:8px;font-size:15px;cursor:pointer;margin:5px;}
#screen-overlay button:hover{background:#6d28d9;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-left">
      <div class="bar-wrap"><div class="bar-label">❤️ HP</div><div class="bar" id="hp-bar" style="width:100%"></div></div>
      <div class="bar-wrap"><div class="bar-label">✨ MP</div><div class="bar mp-bar" id="mp-bar" style="width:100%"></div></div>
      <div class="bar-wrap"><div class="bar-label">⭐ XP</div><div class="bar xp-bar" id="xp-bar" style="width:0%"></div></div>
    </div>
    <div id="quest-box">Quest: <span id="quest-text">Explore the realm</span></div>
    <div class="hud-right">
      <div id="coins">🪙 <span id="coin-count">0</span></div>
    </div>
  </div>
</div>
<div id="level-badge">LV <span id="lvl">1</span></div>
<canvas id="minimap"></canvas>
<div id="msg"></div>
<div id="controls">
  <div id="joystick-area">
    <div id="joystick-base"></div>
    <div id="joystick-knob"></div>
  </div>
  <div id="action-btns">
    <div id="btn-row">
      <div class="abtn" id="btn-spell" title="Spell">🔮</div>
      <div class="abtn" id="btn-attack" title="Attack">⚔️</div>
    </div>
    <div id="btn-row">
      <div class="abtn" id="btn-dodge" title="Dodge">💨</div>
      <div class="abtn" id="btn-potion" title="Heal">🧪</div>
    </div>
  </div>
</div>
<div id="screen-overlay" id="start-screen">
  <div style="font-size:52px;margin-bottom:8px;">🕯️</div>
  <h1>NOKIELEN</h1>
  <p>Open World Horror RPG<br>Fight creatures, collect coins, cast spells & survive</p>
  <button id="start-btn">▶ Begin Adventure</button>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const mm=document.getElementById('minimap');
const mctx=mm.getContext('2d');
mm.width=mm.height=70;

let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const overlay=document.getElementById('screen-overlay');
document.getElementById('start-btn').onclick=()=>{overlay.style.display='none';gameRunning=true;};

// ---- WORLD ----
const TILE=48,WORLD=80;
const map=[];
const trees=[],rocks=[],portals=[];
for(let y=0;y<WORLD;y++){map[y]=[];for(let x=0;x<WORLD;x++)map[y][x]=0;}
// paths
for(let i=0;i<WORLD;i++){map[WORLD/2|0][i]=1;map[i][WORLD/2|0]=1;}
// random obstacles
for(let i=0;i<300;i++){
  const x=2+Math.random()*(WORLD-4)|0,y=2+Math.random()*(WORLD-4)|0;
  if(Math.abs(x-40)>3&&Math.abs(y-40)>3){map[y][x]=2;trees.push({x,y});}
}
for(let i=0;i<120;i++){
  const x=2+Math.random()*(WORLD-4)|0,y=2+Math.random()*(WORLD-4)|0;
  if(map[y][x]===0&&Math.abs(x-40)>3&&Math.abs(y-40)>3){map[y][x]=3;rocks.push({x,y});}
}
// portals
for(let i=0;i<3;i++)portals.push({x:(10+i*25)*TILE,y:(15+i*20)*TILE,r:16,zone:i});

const GRASS=['#1a3a1a','#1e421e','#163416','#1c3c1c'];
const DARK='#0a0a14';
const grassNoise=[];
for(let i=0;i<WORLD*WORLD;i++)grassNoise.push(GRASS[Math.random()*GRASS.length|0]);

// ---- PLAYER ----
const pl={
  x:WORLD/2*TILE,y:WORLD/2*TILE,
  vx:0,vy:0,
  hp:100,maxHp:100,mp:80,maxMp:80,
  xp:0,xpNext:100,level:1,
  coins:0,
  r:14,
  angle:0,
  invincible:0,
  dodging:0,
  potions:3,
  facing:0,
  kills:0,
  questKills:0,questCoins:0,questPortal:-1
};

// ---- QUESTS ----
const quests=[
  {desc:'Kill 5 creatures',check:()=>pl.questKills>=5,reward:{coins:30,xp:40}},
  {desc:'Collect 20 coins',check:()=>pl.questCoins>=20,reward:{coins:20,xp:30}},
  {desc:'Reach the blue portal',check:()=>pl.questPortal>=0,reward:{coins:50,xp:60}},
  {desc:'Kill 10 creatures',check:()=>pl.kills>=10,reward:{coins:60,xp:80}},
  {desc:'Reach level 3',check:()=>pl.level>=3,reward:{coins:100,xp:100}},
];
let questIdx=0;
function updateQuest(){document.getElementById('quest-text').textContent=questIdx<quests.length?quests[questIdx].desc:'All quests done!';}
updateQuest();

// ---- ENEMIES ----
const ETYPES=[
  {name:'Wraith',col:'#8800cc',size:13,hp:30,spd:1.1,dmg:8,xp:12,coins:[1,3],spell:false},
  {name:'Golem',col:'#885500',size:18,hp:70,spd:0.55,dmg:18,xp:25,coins:[3,7],spell:false},
  {name:'Specter',col:'#005588',size:11,hp:20,spd:1.6,dmg:6,xp:10,coins:[1,2],spell:true},
  {name:'Demon',col:'#cc0000',size:16,hp:90,spd:0.8,dmg:22,xp:35,coins:[5,10],spell:false},
  {name:'Banshee',col:'#00aaaa',size:12,hp:25,spd:1.4,dmg:10,xp:15,coins:[2,4],spell:true},
];
const enemies=[];
function spawnEnemy(){
  if(enemies.length>18)return;
  const et=ETYPES[Math.random()*ETYPES.length|0];
  const angle=Math.random()*Math.PI*2;
  const dist=300+Math.random()*250;
  const x=pl.x+Math.cos(angle)*dist,y=pl.y+Math.sin(angle)*dist;
  if(x<TILE||x>(WORLD-1)*TILE||y<TILE||y>(WORLD-1)*TILE)return;
  enemies.push({
    x,y,vx:0,vy:0,
    hp:et.hp*(1+pl.level*0.15)|0,
    maxHp:et.hp*(1+pl.level*0.15)|0,
    spd:et.spd,dmg:et.dmg,col:et.col,
    size:et.size,xp:et.xp,
    coinRange:et.coins,spell:et.spell,
    r:et.size,
    shootTimer:Math.random()*120,
    phase:0,name:et.name,
    flash:0,dead:false
  });
}
for(let i=0;i<10;i++)spawnEnemy();

// ---- PROJECTILES ----
const bullets=[]; // player bullets
const eprojs=[]; // enemy projectiles
const particles=[];
const coins=[];
const floatingTexts=[];

function spawnCoin(x,y,val){
  for(let i=0;i<val;i++)coins.push({x:x+(Math.random()-0.5)*30,y:y+(Math.random()-0.5)*30,val:1,r:6,collected:false,vy:-1,t:0});
}
function spawnParticles(x,y,col,n,big){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(big?2:1)+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col,r:big?4:2});
  }
}
function floatText(x,y,txt,col){floatingTexts.push({x,y,txt,col,t:1,vy:-1.2});}

// ---- SPELLS ----
const spells=[];
function castSpell(){
  if(pl.mp<20){showMsg("Not enough MP!");return;}
  pl.mp-=20;
  // ring of projectiles
  for(let i=0;i<8;i++){
    const a=pl.angle+(i/8)*Math.PI*2;
    spells.push({x:pl.x,y:pl.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,r:10,life:1,dmg:30,col:'#a855f7'});
  }
  spawnParticles(pl.x,pl.y,'#a855f7',20,true);
  showMsg("✨ Arcane Burst!");
}

// ---- CONTROLS ----
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){shootBullet();}if(e.key==='q')castSpell();if(e.key==='e')usePotionAction();});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

// Joystick
const jBase=document.getElementById('joystick-base');
const jKnob=document.getElementById('joystick-knob');
const jArea=document.getElementById('joystick-area');
let jActive=false,jX=0,jY=0,jDX=0,jDY=0;
function jRect(){return jBase.getBoundingClientRect();}
function onJStart(e){
  jActive=true;
  const r=jRect();jX=r.left+r.width/2;jY=r.top+r.height/2;
  onJMove(e);
}
function onJMove(e){
  if(!jActive)return;
  const t=e.touches?e.touches[0]:e;
  const dx=t.clientX-jX,dy=t.clientY-jY;
  const d=Math.min(35,Math.hypot(dx,dy));
  const a=Math.atan2(dy,dx);
  jDX=Math.cos(a)*(d/35);jDY=Math.sin(a)*(d/35);
  jKnob.style.left=(27+Math.cos(a)*d)+'px';
  jKnob.style.bottom=(27-Math.sin(a)*d)+'px';
}
function onJEnd(){jActive=false;jDX=0;jDY=0;jKnob.style.left='27px';jKnob.style.bottom='27px';}
jArea.addEventListener('touchstart',onJStart,{passive:true});
jArea.addEventListener('touchmove',onJMove,{passive:true});
jArea.addEventListener('touchend',onJEnd);
jArea.addEventListener('mousedown',onJStart);
window.addEventListener('mousemove',onJMove);
window.addEventListener('mouseup',onJEnd);

// Aim with mouse/touch on canvas
canvas.addEventListener('mousemove',e=>{pl.angle=Math.atan2(e.clientY-H/2,e.clientX-W/2);});
canvas.addEventListener('click',e=>{pl.angle=Math.atan2(e.clientY-H/2,e.clientX-W/2);shootBullet();});

// touch aim + shoot on right side of canvas
let aimTouch=null;
canvas.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    if(t.clientX>W/2){
      aimTouch=t.identifier;
      pl.angle=Math.atan2(t.clientY-H/2,t.clientX-W/2);
      shootBullet();
    }
  }
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===aimTouch){
      pl.angle=Math.atan2(t.clientY-H/2,t.clientX-W/2);
    }
  }
},{passive:true});

// Action buttons
document.getElementById('btn-attack').addEventListener('click',shootBullet);
document.getElementById('btn-attack').addEventListener('touchstart',e=>{e.preventDefault();shootBullet();},{passive:false});
document.getElementById('btn-spell').addEventListener('click',castSpell);
document.getElementById('btn-spell').addEventListener('touchstart',e=>{e.preventDefault();castSpell();},{passive:false});
document.getElementById('btn-dodge').addEventListener('click',doDodge);
document.getElementById('btn-dodge').addEventListener('touchstart',e=>{e.preventDefault();doDodge();},{passive:false});
document.getElementById('btn-potion').addEventListener('click',usePotionAction);
document.getElementById('btn-potion').addEventListener('touchstart',e=>{e.preventDefault();usePotionAction();},{passive:false});

let shootCool=0;
function shootBullet(){
  if(shootCool>0)return;
  shootCool=12;
  const spd=9;
  bullets.push({x:pl.x,y:pl.y,vx:Math.cos(pl.angle)*spd,vy:Math.sin(pl.angle)*spd,r:7,life:1,dmg:15+pl.level*3,col:'#f90',trail:[]});
  spawnParticles(pl.x,pl.y,'#f90',3,false);
}
function doDodge(){
  if(pl.dodging>0)return;
  pl.dodging=20;pl.invincible=20;
  pl.vx+=Math.cos(pl.angle)*8;pl.vy+=Math.sin(pl.angle)*8;
  spawnParticles(pl.x,pl.y,'#88aaff',10,false);
}
function usePotionAction(){
  if(pl.potions<=0){showMsg("No potions left!");return;}
  pl.potions--;pl.hp=Math.min(pl.maxHp,pl.hp+40);pl.mp=Math.min(pl.maxMp,pl.mp+20);
  showMsg(`🧪 Healed! (${pl.potions} left)`);
  spawnParticles(pl.x,pl.y,'#0f0',12,true);
}

// ---- HELPERS ----
function solid(wx,wy){
  const tx=wx/TILE|0,ty=wy/TILE|0;
  if(tx<0||ty<0||tx>=WORLD||ty>=WORLD)return true;
  return map[ty][tx]===2||map[ty][tx]===3;
}
let msgTimer=0;
function showMsg(t){
  const el=document.getElementById('msg');
  el.textContent=t;el.style.opacity=1;
  clearTimeout(msgTimer);msgTimer=setTimeout(()=>el.style.opacity=0,2200);
}
function giveXP(n){
  pl.xp+=n;
  if(pl.xp>=pl.xpNext){
    pl.xp-=pl.xpNext;pl.level++;pl.xpNext=(pl.xpNext*1.5)|0;
    pl.maxHp+=15;pl.hp=pl.maxHp;pl.maxMp+=10;pl.mp=pl.maxMp;
    pl.potions++;
    showMsg(`⭐ Level Up! You are now LV ${pl.level}`);
    spawnParticles(pl.x,pl.y,'#ffd700',30,true);
    document.getElementById('lvl').textContent=pl.level;
  }
  const pct=(pl.xp/pl.xpNext*100)+'%';
  document.getElementById('xp-bar').style.width=pct;
}
function checkQuest(){
  if(questIdx>=quests.length)return;
  if(quests[questIdx].check()){
    const q=quests[questIdx];
    pl.coins+=q.reward.coins;giveXP(q.reward.xp);
    showMsg(`✅ Quest Complete! +${q.reward.coins} coins +${q.reward.xp} XP`);
    spawnParticles(pl.x,pl.y,'#ffd700',30,true);
    questIdx++;updateQuest();
  }
}

// ---- CAMERA ----
let camX=0,camY=0;

// ---- GAME STATE ----
let gameRunning=false,gameDead=false,gameWon=false,tick=0;

// ---- MAIN LOOP ----
function update(){
  if(!gameRunning)return;
  tick++;
  if(shootCool>0)shootCool--;
  if(pl.invincible>0)pl.invincible--;
  if(pl.dodging>0)pl.dodging--;
  // mp regen
  if(tick%90===0&&pl.mp<pl.maxMp)pl.mp=Math.min(pl.maxMp,pl.mp+3);

  // movement
  const spd=pl.dodging?0:3.2;
  let mx=0,my=0;
  if(keys['ArrowLeft']||keys['a'])mx-=1;
  if(keys['ArrowRight']||keys['d'])mx+=1;
  if(keys['ArrowUp']||keys['w'])my-=1;
  if(keys['ArrowDown']||keys['s'])my+=1;
  if(jActive){mx=jDX;my=jDY;}
  if(mx||my){const l=Math.hypot(mx,my);mx/=l;my/=l;}
  pl.vx=pl.vx*0.7+mx*spd*0.3+mx*(spd);
  pl.vy=pl.vy*0.7+my*spd*0.3+my*(spd);
  pl.vx*=0.7;pl.vy*=0.7;

  // collide world
  const nx=pl.x+pl.vx,ny=pl.y+pl.vy;
  if(!solid(nx,pl.y)&&!solid(nx+1,pl.y)&&!solid(nx-1,pl.y))pl.x=nx;else pl.vx=0;
  if(!solid(pl.x,ny)&&!solid(pl.x,ny+1)&&!solid(pl.x,ny-1))pl.y=ny;else pl.vy=0;
  pl.x=Math.max(TILE,Math.min((WORLD-1)*TILE,pl.x));
  pl.y=Math.max(TILE,Math.min((WORLD-1)*TILE,pl.y));

  camX=pl.x-W/2;camY=pl.y-H/2;

  // player bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>6)b.trail.shift();
    b.x+=b.vx;b.y+=b.vy;
    if(solid(b.x,b.y)){spawnParticles(b.x,b.y,'#f90',5,false);bullets.splice(i,1);continue;}
    b.life-=0.018;
    if(b.life<=0){bullets.splice(i,1);continue;}
    let hit=false;
    for(const e of enemies){
      if(e.dead)continue;
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){
        e.hp-=b.dmg;e.flash=8;
        floatText(e.x,e.y-20,'-'+b.dmg,'#f90');
        spawnParticles(b.x,b.y,e.col,8,false);
        bullets.splice(i,1);hit=true;
        if(e.hp<=0){killEnemy(e);}
        break;
      }
    }
    if(hit)continue;
  }

  // spells
  for(let i=spells.length-1;i>=0;i--){
    const s=spells[i];
    s.x+=s.vx;s.y+=s.vy;s.life-=0.015;
    if(s.life<=0||solid(s.x,s.y)){spells.splice(i,1);continue;}
    for(const e of enemies){
      if(e.dead)continue;
      if(Math.hypot(s.x-e.x,s.y-e.y)<e.r+s.r){
        e.hp-=s.dmg;e.flash=8;
        floatText(e.x,e.y-20,'-'+s.dmg,'#a855f7');
        spawnParticles(s.x,s.y,'#a855f7',10,true);
        spells.splice(i,1);
        if(e.hp<=0)killEnemy(e);
        break;
      }
    }
  }

  // enemies
  for(const e of enemies){
    if(e.dead)continue;
    if(e.flash>0)e.flash--;
    const dx=pl.x-e.x,dy=pl.y-e.y,dist=Math.hypot(dx,dy);
    if(dist<400){
      e.vx+=(dx/dist)*e.spd*0.3;e.vy+=(dy/dist)*e.spd*0.3;
      e.vx*=0.75;e.vy*=0.75;
      if(!solid(e.x+e.vx,e.y))e.x+=e.vx;else e.vx*=-0.5;
      if(!solid(e.x,e.y+e.vy))e.y+=e.vy;else e.vy*=-0.5;
      // enemy attack
      if(dist<e.r+pl.r+8&&pl.invincible<=0){
        pl.hp-=e.dmg*0.15;
        pl.invincible=20;
        spawnParticles(pl.x,pl.y,'#f00',6,false);
        floatText(pl.x,pl.y-30,'-'+Math.round(e.dmg*0.15),'#f55');
      }
      // enemy projectile
      if(e.spell){
        e.shootTimer--;
        if(e.shootTimer<=0){
          e.shootTimer=80+Math.random()*60;
          const a=Math.atan2(dy,dx);
          eprojs.push({x:e.x,y:e.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,r:8,dmg:e.dmg,col:e.col,life:1});
        }
      }
    }
  }

  // enemy projectiles
  for(let i=eprojs.length-1;i>=0;i--){
    const p=eprojs[i];
    p.x+=p.vx;p.y+=p.vy;p.life-=0.012;
    if(p.life<=0||solid(p.x,p.y)){eprojs.splice(i,1);continue;}
    if(pl.invincible<=0&&Math.hypot(p.x-pl.x,p.y-pl.y)<pl.r+p.r){
      pl.hp-=p.dmg;pl.invincible=25;
      floatText(pl.x,pl.y-30,'-'+p.dmg,'#f55');
      spawnParticles(pl.x,pl.y,'#f00',8,false);
      eprojs.splice(i,1);continue;
    }
  }

  // coins
  for(const c of coins){
    if(c.collected)continue;
    c.t++;c.vy+=0.05;c.y+=c.vy;
    if(Math.hypot(c.x-pl.x,c.y-pl.y)<28){
      c.collected=true;pl.coins+=c.val;pl.questCoins+=c.val;
      document.getElementById('coin-count').textContent=pl.coins;
      checkQuest();
    }
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.93;p.vy*=0.93;p.life-=0.04;
    if(p.life<=0)particles.splice(i,1);
  }
  // float texts
  for(let i=floatingTexts.length-1;i>=0;i--){
    const f=floatingTexts[i];
    f.y+=f.vy;f.t-=0.03;
    if(f.t<=0)floatingTexts.splice(i,1);
  }

  // portals
  for(const p of portals){
    if(Math.hypot(pl.x-p.x,pl.y-p.y)<p.r+pl.r){
      pl.questPortal=p.zone;
      showMsg(`🌀 Entered Zone ${p.zone+1}!`);
      checkQuest();
    }
  }

  // spawn enemies
  if(tick%180===0)spawnEnemy();

  // health bar
  document.getElementById('hp-bar').style.width=(pl.hp/pl.maxHp*100)+'%';
  document.getElementById('hp-bar').style.background=pl.hp<pl.maxHp*0.3?'#f00':'';
  document.getElementById('mp-bar').style.width=(pl.mp/pl.maxMp*100)+'%';

  // death
  if(pl.hp<=0&&!gameDead){
    gameDead=true;gameRunning=false;
    overlay.style.display='flex';
    overlay.innerHTML=`<div style="font-size:60px">💀</div><h1 style="color:#c00;letter-spacing:3px">YOU DIED</h1><p>Coins: ${pl.coins} | Level: ${pl.level} | Kills: ${pl.kills}</p><button onclick="location.reload()">↺ Try Again</button>`;
  }
  // win
  if(questIdx>=quests.length&&!gameWon){
    gameWon=true;gameRunning=false;
    overlay.style.display='flex';
    overlay.innerHTML=`<div style="font-size:60px">🏆</div><h1 style="color:#ffd700;letter-spacing:3px">VICTORY!</h1><p>All quests complete!<br>Coins: ${pl.coins} | Level: ${pl.level} | Kills: ${pl.kills}</p><button onclick="location.reload()">Play Again</button>`;
  }
}

function killEnemy(e){
  e.dead=true;
  spawnParticles(e.x,e.y,e.col,20,true);
  const cv=e.coinRange[0]+Math.random()*(e.coinRange[1]-e.coinRange[0])|0;
  spawnCoin(e.x,e.y,cv);
  giveXP(e.xp);
  pl.kills++;pl.questKills++;
  floatText(e.x,e.y-30,'+'+e.xp+' XP','#ffd700');
  checkQuest();
  document.getElementById('coin-count').textContent=pl.coins;
}

// ---- DRAW ----
function drawWorld(){
  // tiles
  const sx=camX/TILE|0,sy=camY/TILE|0;
  const ex=Math.ceil((camX+W)/TILE)+1,ey=Math.ceil((camY+H)/TILE)+1;
  for(let ty=Math.max(0,sy);ty<Math.min(WORLD,ey);ty++){
    for(let tx=Math.max(0,sx);tx<Math.min(WORLD,ex);tx++){
      const wx=tx*TILE-camX,wy=ty*TILE-camY;
      const t=map[ty][tx];
      if(t===0||t===1){
        ctx.fillStyle=grassNoise[ty*WORLD+tx];
        ctx.fillRect(wx,wy,TILE,TILE);
        if(t===1){ctx.fillStyle='rgba(100,80,30,0.25)';ctx.fillRect(wx,wy,TILE,TILE);}
      }
    }
  }
  // trees
  for(const t of trees){
    const wx=t.x*TILE+TILE/2-camX,wy=t.y*TILE+TILE/2-camY;
    if(wx<-50||wx>W+50||wy<-50||wy>H+50)continue;
    ctx.fillStyle='#0a1a0a';ctx.beginPath();ctx.arc(wx,wy,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a3a1a';ctx.beginPath();ctx.arc(wx,wy,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0d5c0d';ctx.beginPath();ctx.arc(wx-3,wy-5,10,0,Math.PI*2);ctx.fill();
  }
  // rocks
  for(const r of rocks){
    const wx=r.x*TILE+TILE/2-camX,wy=r.y*TILE+TILE/2-camY;
    if(wx<-40||wx>W+40||wy<-40||wy>H+40)continue;
    ctx.fillStyle='#3a3a3a';ctx.beginPath();ctx.ellipse(wx,wy,13,9,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#555';ctx.beginPath();ctx.ellipse(wx-2,wy-2,9,6,0.3,0,Math.PI*2);ctx.fill();
  }
  // portals
  const pcols=['#0066ff','#aa00ff','#00aaff'];
  for(const p of portals){
    const wx=p.x-camX,wy=p.y-camY;
    if(wx<-80||wx>W+80||wy<-80||wy>H+80)continue;
    const pulse=Math.sin(tick*0.07)*4;
    ctx.save();
    ctx.strokeStyle=pcols[p.zone%3];ctx.lineWidth=3;
    ctx.globalAlpha=0.8;
    ctx.beginPath();ctx.arc(wx,wy,p.r+pulse,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.3;
    ctx.fillStyle=pcols[p.zone%3];ctx.beginPath();ctx.arc(wx,wy,p.r+pulse,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.fillStyle='#fff';ctx.font='11px Courier New';ctx.textAlign='center';
    ctx.fillText('PORTAL',wx,wy+p.r+16);
  }
  // coins
  for(const c of coins){
    if(c.collected)continue;
    const wx=c.x-camX,wy=c.y-camY;
    if(wx<-20||wx>W+20||wy<-20||wy>H+20)continue;
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(wx,wy,c.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffee44';ctx.beginPath();ctx.arc(wx-2,wy-2,3,0,Math.PI*2);ctx.fill();
  }
}

function drawEnemies(){
  for(const e of enemies){
    if(e.dead)continue;
    const wx=e.x-camX,wy=e.y-camY;
    if(wx<-60||wx>W+60||wy<-60||wy>H+60)continue;
    ctx.save();
    ctx.fillStyle=e.flash>0?'#fff':e.col;
    ctx.globalAlpha=0.92;
    ctx.beginPath();ctx.arc(wx,wy,e.r,0,Math.PI*2);ctx.fill();
    // eyes
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(wx-4,wy-3,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(wx+4,wy-3,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(wx-3,wy-3,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(wx+5,wy-3,1.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // hp bar
    const bw=e.r*2+4,bx=wx-bw/2,by=wy-e.r-10;
    ctx.fillStyle='#300';ctx.fillRect(bx,by,bw,5);
    ctx.fillStyle='#e33';ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),5);
    // name
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='9px Courier New';ctx.textAlign='center';
    ctx.fillText(e.name,wx,wy+e.r+12);
  }
}

function drawPlayer(){
  const wx=W/2,wy=H/2;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(wx,wy+pl.r-2,pl.r,6,0,0,Math.PI*2);ctx.fill();
  // body
  ctx.save();ctx.translate(wx,wy);
  const bob=Math.sin(tick*0.2)*2*(Math.abs(pl.vx)+Math.abs(pl.vy)>0.3?1:0);
  ctx.fillStyle=pl.invincible%4<2?'rgba(150,200,255,0.9)':'#7dd3fc';
  ctx.beginPath();ctx.arc(0,bob,pl.r,0,Math.PI*2);ctx.fill();
  // cloak
  ctx.fillStyle='#1e3a5f';
  ctx.beginPath();ctx.moveTo(-pl.r,bob+4);ctx.lineTo(pl.r,bob+4);ctx.lineTo(pl.r+3,bob+pl.r+6);ctx.lineTo(-pl.r-3,bob+pl.r+6);ctx.closePath();ctx.fill();
  // face & direction
  const fx=Math.cos(pl.angle)*6,fy=Math.sin(pl.angle)*6;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx*0.5+2,fy*0.5+bob-3,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx*0.5-2,fy*0.5+bob-3,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(fx*0.5+2+fx*0.15,fy*0.5+bob-3+fy*0.15,1.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(fx*0.5-2+fx*0.15,fy*0.5+bob-3+fy*0.15,1.5,0,Math.PI*2);ctx.fill();
  // weapon arm
  ctx.strokeStyle='#ffa500';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(fx*0.4,fy*0.4+bob);ctx.lineTo(fx*1.4,fy*1.4+bob);ctx.stroke();
  ctx.restore();
}

function drawBullets(){
  for(const b of bullets){
    const wx=b.x-camX,wy=b.y-camY;
    // trail
    for(let i=0;i<b.trail.length;i++){
      const a=(i/b.trail.length)*0.5;
      ctx.globalAlpha=a;ctx.fillStyle='#f90';
      ctx.beginPath();ctx.arc(b.trail[i].x-camX,b.trail[i].y-camY,b.r*(i/b.trail.length),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(wx,wy,b.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(wx-2,wy-2,2,0,Math.PI*2);ctx.fill();
  }
  for(const s of spells){
    const wx=s.x-camX,wy=s.y-camY;
    ctx.globalAlpha=s.life;ctx.fillStyle=s.col;
    ctx.beginPath();ctx.arc(wx,wy,s.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(wx,wy,4,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of eprojs){
    const wx=p.x-camX,wy=p.y-camY;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(wx,wy,p.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(wx-2,wy-2,3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life*0.9;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x-camX,p.y-camY,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const f of floatingTexts){
    ctx.globalAlpha=f.t;ctx.fillStyle=f.col;
    ctx.font='bold 13px Courier New';ctx.textAlign='center';
    ctx.fillText(f.txt,f.x-camX,f.y-camY);
  }
  ctx.globalAlpha=1;
}

function drawMinimap(){
  mctx.fillStyle='rgba(0,0,0,0.85)';mctx.fillRect(0,0,70,70);
  const scale=70/(WORLD*TILE);
  // player
  const px=pl.x*scale,py=pl.y*scale;
  mctx.fillStyle='#7dd3fc';mctx.beginPath();mctx.arc(px,py,3,0,Math.PI*2);mctx.fill();
  // enemies
  for(const e of enemies){
    if(e.dead)continue;
    mctx.fillStyle=e.col;mctx.beginPath();mctx.arc(e.x*scale,e.y*scale,2,0,Math.PI*2);mctx.fill();
  }
  // portals
  mctx.fillStyle='#66f';
  for(const p of portals){mctx.beginPath();mctx.arc(p.x*scale,p.y*scale,3,0,Math.PI*2);mctx.fill();}
  // view rect
  mctx.strokeStyle='rgba(255,255,255,0.4)';mctx.lineWidth=1;
  mctx.strokeRect(camX*scale,camY*scale,W*scale,H*scale);
}

function render(){
  ctx.fillStyle=DARK;ctx.fillRect(0,0,W,H);
  drawWorld();
  drawParticles();
  drawBullets();
  drawEnemies();
  drawPlayer();
  // fog of war vignette
  const grad=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.9);
  grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,10,0.7)');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  drawMinimap();
}

function loop(){
  update();render();
  requestAnimationFrame(loop);
}
loop();
</script>
